  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@1,9..144,300,100&family=Shippori+Mincho:wght@400&family=Space+Mono&display=swap" rel="stylesheet">

  <style>
    /* Layout: one full-bleed light study; a museum-style label rests bottom-left,
       the kanji runs vertically along the left edge, the controls sit top-right. */
    :root {
      --ink:    #4a1f35;   /* deep rose-plum */
      --ink-60: rgba(74, 31, 53, .62);
      --rose:   #ffaaa5;
      --peach:  #ffb48b;
      --dusk:   #c5887a;
      --font-display: 'Fraunces', 'Cormorant Garamond', Georgia, serif;
      --font-jp:      'Shippori Mincho', 'Noto Serif JP', serif;
      --font-mono:    'Space Mono', ui-monospace, monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* The gradient is also the no-WebGL fallback: warm light in the middle, dusk at the edges */
    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
    body {
      background: radial-gradient(ellipse at 50% 50%, var(--peach) 0%, #db957f 55%, var(--dusk) 100%);
      color: var(--ink);
      font-family: var(--font-display);
    }

    /* The drawing buffer is half the CSS size: CSS stretches it full screen.
       touch-action: none → a finger sends continuous pointermove, no browser pan/zoom */
    #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    .gl-lost #c { visibility: hidden; }        /* GPU context lost: the gradient shows through */

    /* ── Chrome ── */
    .back-link, .exp-label {
      position: fixed; z-index: 2; top: 28px;
      font-family: var(--font-mono);
      font-size: 10px; letter-spacing: .3em; text-transform: uppercase;
      color: var(--ink-60);
    }
    .back-link {
      left: clamp(20px, 4vw, 60px);
      text-decoration: none;
      display: flex; align-items: center; gap: 8px;
      transition: color .25s;
    }
    .back-link:hover, .back-link:focus-visible { color: var(--ink); }
    .back-link::before { content: '←'; }
    .exp-label { right: 72px; }                /* left of the controls button */

    /* ── Vertical kanji on the left edge ── */
    .kanji {
      position: fixed; z-index: 2;
      left: clamp(18px, 3.4vw, 52px); top: 50%;
      transform: translateY(-50%);
      writing-mode: vertical-rl;
      font-family: var(--font-jp); font-size: clamp(20px, 2.2vw, 30px);
      letter-spacing: .5em;
      color: var(--ink-60);
    }
    @media (max-height: 560px) { .kanji { display: none; } }   /* short screens: room for the label */

    /* ── Museum label ── */
    .label {
      position: fixed; z-index: 2;
      left: clamp(20px, 4vw, 60px); bottom: clamp(28px, 6vh, 64px);
      max-width: min(560px, 80vw);
      pointer-events: none;
    }
    .label__kicker {
      font-family: var(--font-mono); font-size: 10px; letter-spacing: .32em; text-transform: uppercase;
      color: var(--ink-60);
    }
    .label__title {
      font-style: italic; font-weight: 300;
      font-variation-settings: 'SOFT' 100, 'opsz' 144;
      font-size: clamp(64px, 11vw, 168px); line-height: .9;
      letter-spacing: -.02em;
      margin: .12em 0 .1em -.04em;
    }
    .label__meta { font-style: italic; font-size: clamp(15px, 1.4vw, 19px); color: var(--ink-60); }
    .label__hint {
      margin-top: 14px;
      font-family: var(--font-mono); font-size: 10px; letter-spacing: .24em; text-transform: uppercase;
      color: var(--ink-60);
    }

    /* ── Controls (Tweakpane) ── */
    #tp-toggle {
      position: fixed; z-index: 3; top: 16px; right: 16px;
      width: 40px; height: 40px; border: 0; border-radius: 8px;
      background: rgb(20 15 25 / .85); color: #fff; font-size: 18px;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    #tp-toggle:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
    #tp {
      position: fixed; z-index: 3; top: 64px; right: 16px;
      width: min(280px, calc(100vw - 32px)); max-height: calc(100dvh - 80px); overflow-y: auto;
    }

    /* ── Entrance: the chrome comes into focus, like the light ── */
    @keyframes focus-in { from { opacity: 0; transform: translateY(.3em); filter: blur(8px); } }
    .label, .kanji, .back-link, .exp-label { animation: focus-in 1.6s cubic-bezier(.2, .7, .1, 1) .3s both; }
    .kanji { animation-name: fade; }
    @keyframes fade { from { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
    }
  </style>
</head>
<body>

  <canvas id="c" aria-hidden="true"></canvas>

  <a class="back-link" href="../landing/index.html" aria-label="Back to all experiments">Experiments</a>
  <span class="exp-label" aria-hidden="true">Exp · 16</span>
  <p class="kanji" lang="ja">葉漏れ日</p>

  <header class="label">
    <p class="label__kicker">Esperimento 16 — Il sole tra le foglie</p>
    <h1 class="label__title">Hamorebi</h1>
    <p class="label__meta">Luce che filtra tra le foglie, fuori fuoco</p>
    <p class="label__hint">Muovi il mouse o il dito: la luce segue lo sguardo</p>
  </header>

  <button id="tp-toggle" type="button" aria-label="Mostra o nascondi i controlli" aria-controls="tp" aria-expanded="true" hidden>⚙</button>
  <div id="tp"></div>

  <!-- Three.js r169 via importmap from jsDelivr, same as experiments 01–15; Tweakpane for the controls -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "tweakpane": "https://cdn.jsdelivr.net/npm/tweakpane@4.0.5/dist/tweakpane.min.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';

    /* ================================================================
       Light through leaves, seen out of focus. Inspired by the background
       of microsoft.ai; written from scratch with our own shaders.

       HOW IT WORKS — five fullscreen passes per frame, at half resolution:

         gaze → A → shimmer → B → leaves → A → blur → B → compose → screen

       1. GAZE     the eyes half open around the pointer: clear inside an
                   ellipse, the shade colour outside
       2. SHIMMER  two sine waves bend the image, like air trembling in warm light
       3. LEAVES   every cell of an animated, stretched Voronoi grid shifts its
                   piece of the image: drifting leaves
       4. BLUR     a 50-tap golden-angle disc; bright taps weigh more, so light
                   blooms into soft discs (bokeh)
       5. COMPOSE  the blurred light over a warm wash (procedural)

       Every pass is composited over the light tint, as if painted with alpha
       blending on a sheet of that colour: rgb = mix(light, colour, alpha).
       ================================================================ */

    /* ── Styles: the default look plus presets; every value stays adjustable in the panel ── */
    const SCALE     = 0.5;                               // render at half the CSS pixels (soft image anyway)
    const BLUR_TAPS = 50;                                // samples in the blur disc
    const SHAPE = {                                      // the effect's shape, shared by every style
      gazeRadius: 0.354, gazeSoftness: 1, gazeSquash: 0.54, gazeTurn: 0,
      shimmerFreq: 0.35, shimmerAmp: 1.18, shimmerTurn: 0,
      leafScale: 0.534, leafSpread: 1, leafAngle: 44, leafStretch: 0.84,   // leafAngle in degrees
      blurRadius: 0.754, blurTilt: 0.5,
    };
    const STYLES = {
      'Originale':    { base: '#ffaaa5', shade: '#4a0035', light: '#ffd198', washLight: '#f4d18d', washShade: '#e0713c' },
      'Miele velato': { base: '#f8d27a', shade: '#2e4a50', light: '#fff4da', washLight: '#f6e3b0', washShade: '#d9913f' },
      'Bosco':        { base: '#b6d39c', shade: '#14321f', light: '#fff1b8', washLight: '#e6ecae', washShade: '#6e9a5a' },
      'Crepuscolo':   { base: '#c9b3e6', shade: '#1e1a3a', light: '#ffc9a8', washLight: '#f2c6d8', washShade: '#8a6fc0' },
    };
    const params = { style: 'Originale', ...SHAPE, ...STYLES['Originale'] };   // live state (the panel edits it)

    /** '#rrggbb' → 0..1 as is: no colour-space conversion, the shaders mix the values directly */
    function setHex(vec3, hex) {
      const n = parseInt(hex.slice(1), 16);
      vec3.set((n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255);
    }

    /* ── Renderer — if WebGL is missing, the CSS gradient stays visible ── */
    const canvas = document.getElementById('c');
    let renderer = null;
    try {
      renderer = new THREE.WebGLRenderer({ canvas, antialias: false, depth: false });
      renderer.setPixelRatio(1);                         // SCALE decides the resolution
      // If the GPU drops the context (driver reset, app sent to background on
      // Android), show the CSS gradient until three.js restores it.
      canvas.addEventListener('webglcontextlost', () => {
        console.warn('[HAMOREBI] WebGL context lost, showing CSS fallback.');
        document.body.classList.add('gl-lost');
      });
      canvas.addEventListener('webglcontextrestored', () => document.body.classList.remove('gl-lost'));
    } catch (err) {
      console.warn('[HAMOREBI] WebGL unavailable, showing CSS fallback.', err);
      canvas.remove();
    }

    /* ================================================================
       GLSL
       ================================================================ */
    const VERT = /* glsl */`
      out vec2 vUv;
      void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
    `;

    // Shared by the passes: composite over the light tint, and a 2D rotation
    const COMMON = /* glsl */`
      #define TAU 6.28318530718
      uniform vec3 uLight;
      vec4 overLight(vec4 c) { return vec4(mix(uLight, c.rgb, c.a), c.a); }
      vec2 turn(vec2 v, float a) {                          // counter-clockwise by a radians
        float c = cos(a), s = sin(a);
        return vec2(c * v.x - s * v.y, s * v.x + c * v.y);
      }
    `;

    // 1. GAZE — clear (base colour, transparent) inside an ellipse around the
    // pointer, the shade colour (opaque) outside; softness widens the edge
    const GAZE_FRAG = /* glsl */`
      uniform vec2  uResolution, uPointer;
      uniform float uRadius, uSoftness, uSquash, uTurn;
      uniform vec3  uBase, uShade;
      in  vec2 vUv;
      out vec4 fragColor;
      ${COMMON}
      void main() {
        vec2  d    = (vUv - uPointer) * vec2(uResolution.x / uResolution.y, 1.0);
        d          = turn(d, uTurn * TAU) * vec2(uSquash, 1.0 - uSquash);   // squash the circle into an ellipse
        float edge = 0.5 * uRadius, soft = 0.25 * uRadius * uSoftness;
        float shut = smoothstep(edge - soft, edge + soft, length(d));       // 0 in the gaze → 1 outside
        fragColor  = overLight(vec4(mix(uBase, uShade, shut), shut));
      }
    `;

    // 2. SHIMMER — two travelling sine waves push the image sideways
    // (turn 0) or up and down (turn 1)
    const SHIMMER_FRAG = /* glsl */`
      uniform sampler2D tInput;
      uniform float uTime, uFreq, uAmp, uTurn;
      in  vec2 vUv;
      out vec4 fragColor;
      ${COMMON}
      void main() {
        float k     = 40.0 * uFreq;                        // waves across the screen
        float phase = uTime * TAU / 24.0;                  // one cycle every 24 units of animation time
        vec2  push  = 0.1 * uAmp * vec2(
          (1.0 - uTurn) * sin(k * vUv.y - 10.0 * uFreq + phase),
          uTurn         * sin(k * vUv.x - 30.0 * uFreq + phase));
        fragColor = overLight(texture(tInput, vUv + push));
      }
    `;

    // 3. LEAVES — a Voronoi grid, turned and stretched into slanted leaves; each
    // cell moves its piece of the image by its own slowly orbiting offset
    const LEAVES_FRAG = /* glsl */`
      uniform sampler2D tInput;
      uniform vec2  uResolution;
      uniform float uTime, uScale, uSpread, uAngle, uStretch;
      in  vec2 vUv;
      out vec4 fragColor;
      ${COMMON}
      // Inigo Quilez's 2D cell hash (MIT)
      vec2 cellHash(vec2 p) {
        return fract(sin(vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)))) * 43758.5453);
      }
      void main() {
        vec2 p = (vUv - 0.5) * vec2(uResolution.x / uResolution.y, 1.0) * 50.0 * uScale;
        p = turn(p, uAngle * TAU) * vec2(1.0, 1.0 - uStretch);   // slant, then stretch into leaves
        vec2  cell = floor(p), f = fract(p);
        float nearest = 15.0;
        vec2  seed = vec2(0.0);                                  // the winning cell's point, 0..1
        for (int y = -1; y <= 1; y++) {
          for (int x = -1; x <= 1; x++) {
            vec2  n = vec2(float(x), float(y));
            vec2  q = 0.5 + 0.5 * sin(5.0 + uTime * 0.2 + TAU * cellHash(cell + n));  // orbiting point
            float d = length(n + q - f);
            if (d < nearest) { nearest = d; seed = q; }
          }
        }
        fragColor = overLight(texture(tInput, vUv + (seed - 0.5) * 0.4 * uSpread));
      }
    `;

    // 4. BLUR — a disc of TAPS samples on the golden-angle spiral (precomputed in
    // JS: uKernel = offset xy, angle z). Bright taps weigh up to 31× more, so
    // the light blooms into discs. Blue noise turns the disc a little per pixel
    // to hide the pattern. The loop starts at a non-constant zero so Direct3D
    // and mobile compilers keep it a loop instead of unrolling it.
    const BLUR_FRAG = /* glsl */`
      #define TAPS ${BLUR_TAPS}
      #define ZERO min(int(uResolution.x), 0)
      uniform sampler2D tInput, tBlueNoise;
      uniform vec2  uResolution;
      uniform float uRadius, uTilt;
      uniform vec3  uKernel[TAPS];
      in  vec2 vUv;
      out vec4 fragColor;
      ${COMMON}
      void main() {
        // Blur size: uniform with tilt 0.5; tilt toward 0 or 1 sharpens the edges or the centre
        float focus = 2.0 * mix(1.0 - distance(vUv, vec2(0.5)), distance(vUv, vec2(0.5)), uTilt);
        vec2  stepUv = vec2(uResolution.y / uResolution.x, 1.0) * (0.003 / 0.754) * uRadius * focus;

        // One blue-noise value per pixel (the texture tiles every 256 px)
        float n      = texelFetch(tBlueNoise, ivec2(gl_FragCoord.xy) % textureSize(tBlueNoise, 0), 0).r;
        float jitter = (TAU * fract(n + 0.5) - 0.5) * 0.01;
        float c = cos(jitter * TAU), s = sin(jitter * TAU);

        vec3 sum = vec3(0.0), weight = vec3(0.0);
        float alpha = 0.0;
        for (int i = ZERO; i < TAPS; i++) {
          vec3 k = uKernel[i];
          // a slight petal-shaped wobble of the disc edge
          vec2 o = k.xy * stepUv * (1.0 + 0.05 * (0.5 + 0.5 * sin(k.z * 0.1)) * sin(k.z * 0.7 + jitter));
          vec4 t = textureLod(tInput, vUv + vec2(c * o.x + s * o.y, c * o.y - s * o.x), 0.0);
          vec3 w = 1.0 + 30.0 * pow(t.rgb, vec3(9.0));        // light outweighs shade
          sum    += t.rgb * w;
          weight += w;
          alpha  += t.a;
        }
        fragColor = overLight(vec4(sum / weight, alpha / float(TAPS)));
      }
    `;

    // 5. COMPOSE — a warm wash (two colours mixed by a soft field: a left-to-right
    // slope plus six blurred patches) overlaid on the base colour, then tinted
    // by the blurred light at 26%
    const COMPOSE_FRAG = /* glsl */`
      uniform sampler2D tInput;
      uniform vec3 uBase, uWashLight, uWashShade;
      in  vec2 vUv;
      out vec4 fragColor;
      ${COMMON}
      // Soft elliptical patch: centre (x, y), radii (z, w), turned by a radians
      float patchAt(vec2 uv, vec4 p, float a) {
        vec2 d = turn(uv - p.xy, -a) / p.zw;
        return exp(-dot(d, d));
      }
      float washField(vec2 uv) {
        return 0.4527 - 0.5523 * uv.x
          + 0.3495 * patchAt(uv, vec4(-0.02, 0.83, 0.135, 0.227),  0.187)
          + 0.4050 * patchAt(uv, vec4( 0.32, 0.30, 0.243, 0.620),  0.150)
          + 0.5196 * patchAt(uv, vec4( 0.66, 0.67, 0.285, 0.133), -1.163)
          + 0.6067 * patchAt(uv, vec4(-0.04, 0.06, 0.175, 0.363),  0.300)
          + 0.2129 * patchAt(uv, vec4( 0.73, 0.38, 0.268, 0.040), -1.088)
          + 0.5928 * patchAt(uv, vec4( 1.04, 0.91, 0.188, 0.600),  0.000);
      }
      // W3C "overlay" blend mode
      vec3 overlay(vec3 base, vec3 top) {
        return mix(2.0 * base * top, 1.0 - 2.0 * (1.0 - base) * (1.0 - top), step(0.5, base));
      }
      void main() {
        vec3 wash  = mix(uWashLight, uWashShade, washField(vUv));
        vec3 under = mix(uBase, overlay(uBase, wash), 0.61);
        vec4 fx    = texture(tInput, vUv);
        fragColor  = vec4(under * mix(vec3(1.0), mix(uLight, fx.rgb, fx.a), 0.26), 1.0);
      }
    `;

    if (renderer) start(renderer);

    function start(renderer) {
      /* ── Render targets, quad, shared uniforms ── */
      const targetA = new THREE.WebGLRenderTarget(1, 1, { depthBuffer: false });
      const targetB = new THREE.WebGLRenderTarget(1, 1, { depthBuffer: false });
      const camera  = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);   // render() needs one; the quad ignores it
      const quad    = new THREE.Mesh(new THREE.PlaneGeometry(2, 2));
      quad.frustumCulled = false;

      // One { value } object per uniform, shared by every pass that reads it
      const size     = new THREE.Vector2(1, 1);           // render size in px
      const shared   = {
        uResolution: { value: size },
        uTime:       { value: 0 },
        uPointer:    { value: new THREE.Vector2(0.5, 0.5) }, // smoothed, 0..1, y up
        uLight:      { value: new THREE.Vector3() },
        uBase:       { value: new THREE.Vector3() },
      };
      const pass = (fragmentShader, uniforms) => new THREE.ShaderMaterial({
        glslVersion: THREE.GLSL3, vertexShader: VERT, fragmentShader, uniforms,
        depthTest: false, depthWrite: false,
      });

      const gaze = pass(GAZE_FRAG, {
        uResolution: shared.uResolution, uPointer: shared.uPointer, uLight: shared.uLight, uBase: shared.uBase,
        uShade: { value: new THREE.Vector3() },
        uRadius: { value: 0 }, uSoftness: { value: 0 }, uSquash: { value: 0 }, uTurn: { value: 0 },
      });
      const shimmer = pass(SHIMMER_FRAG, {
        uTime: shared.uTime, uLight: shared.uLight, tInput: { value: targetA.texture },
        uFreq: { value: 0 }, uAmp: { value: 0 }, uTurn: { value: 0 },
      });
      const leaves = pass(LEAVES_FRAG, {
        uResolution: shared.uResolution, uTime: shared.uTime, uLight: shared.uLight, tInput: { value: targetB.texture },
        uScale: { value: 0 }, uSpread: { value: 0 }, uAngle: { value: 0 }, uStretch: { value: 0 },
      });
      const blur = pass(BLUR_FRAG, {
        uResolution: shared.uResolution, uLight: shared.uLight, tInput: { value: targetA.texture },
        tBlueNoise: { value: null }, uKernel: { value: blurKernel(BLUR_TAPS) },
        uRadius: { value: 0 }, uTilt: { value: 0 },
      });
      const compose = pass(COMPOSE_FRAG, {
        uLight: shared.uLight, uBase: shared.uBase, tInput: { value: targetB.texture },
        uWashLight: { value: new THREE.Vector3() }, uWashShade: { value: new THREE.Vector3() },
      });

      // The taps of the blur disc: golden-angle (Vogel) spiral, the radius
      // growing like √(2i) (r ← r + 1/r); z keeps each tap's angle
      function blurKernel(taps) {
        const golden = Math.PI * (3 - Math.sqrt(5));
        let r = 1;
        return Array.from({ length: taps }, (_, i) => {
          const angle = i * golden;
          r += 1 / r;
          return new THREE.Vector3(Math.cos(angle) * (r - 1), Math.sin(angle) * (r - 1), angle);
        });
      }

      /* ── Params → uniforms ── */
      let needsRender = true;                            // reduced motion draws only when something changed
      function applyParams() {
        setHex(shared.uBase.value, params.base);
        setHex(shared.uLight.value, params.light);
        setHex(gaze.uniforms.uShade.value, params.shade);
        setHex(compose.uniforms.uWashLight.value, params.washLight);
        setHex(compose.uniforms.uWashShade.value, params.washShade);
        gaze.uniforms.uRadius.value    = params.gazeRadius;
        gaze.uniforms.uSoftness.value  = params.gazeSoftness;
        gaze.uniforms.uSquash.value    = params.gazeSquash;
        gaze.uniforms.uTurn.value      = params.gazeTurn;
        shimmer.uniforms.uFreq.value   = params.shimmerFreq;
        shimmer.uniforms.uAmp.value    = params.shimmerAmp;
        shimmer.uniforms.uTurn.value   = params.shimmerTurn;
        leaves.uniforms.uScale.value   = params.leafScale;
        leaves.uniforms.uSpread.value  = params.leafSpread;
        leaves.uniforms.uAngle.value   = params.leafAngle / 360;   // the shader wants turns (0..1)
        leaves.uniforms.uStretch.value = params.leafStretch;
        blur.uniforms.uRadius.value    = params.blurRadius;
        blur.uniforms.uTilt.value      = params.blurTilt;
        needsRender = true;
      }
      applyParams();

      /* ── Size: half the CSS pixels; debounced, re-allocating targets mid-drag is useless ── */
      function resize() {
        size.set(Math.max(1, Math.floor(innerWidth * SCALE)), Math.max(1, Math.floor(innerHeight * SCALE)));
        renderer.setSize(size.x, size.y, false);           // false: no inline style, CSS stretches it
        targetA.setSize(size.x, size.y);
        targetB.setSize(size.x, size.y);
        needsRender = true;
      }
      resize();
      let resizeTimer = 0;
      addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(resize, 150); });

      /* ── Pointer: 0..1, y up; starts at the centre; a tap also moves the light ── */
      const pointer = new THREE.Vector2(0.5, 0.5);
      const onPointer = (e) => {
        if (!e.isPrimary) return;                        // a second finger doesn't make the light jump
        pointer.set(e.clientX / innerWidth, 1 - e.clientY / innerHeight);
      };
      addEventListener('pointermove', onPointer, { passive: true });
      addEventListener('pointerdown', onPointer, { passive: true });

      // Reduced motion: centred gaze, time stopped; redraw only on demand
      const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
      reducedMotion.addEventListener('change', () => { needsRender = true; });
      canvas.addEventListener('webglcontextrestored', () => { needsRender = true; });

      /* ── Loop: starts once the blue noise is decoded ── */
      new THREE.TextureLoader().loadAsync(blueNoise()).then((noise) => {
        blur.uniforms.tBlueNoise.value = noise;
        let elapsed = 0, last = performance.now();
        renderer.setAnimationLoop((time) => {
          const dt = Math.min((time - last) / 1000, 0.1);   // clamp: no jump when coming back to the tab
          last = time;
          if (reducedMotion.matches) {
            if (!needsRender) return;                      // still image: the GPU rests
            shared.uPointer.value.set(0.5, 0.5);
          } else {
            elapsed += dt * 2;                             // animation time runs at 2× real time
            shared.uPointer.value.lerp(pointer, 0.1);      // the gaze follows the pointer softly
          }
          needsRender = false;
          shared.uTime.value = elapsed;
          draw(gaze, targetA);
          draw(shimmer, targetB);
          draw(leaves, targetA);
          draw(blur, targetB);
          draw(compose, null);
        });
      }, (err) => console.error('[HAMOREBI] Blue noise failed to load.', err));

      function draw(material, target) {
        quad.material = material;
        renderer.setRenderTarget(target);
        renderer.render(quad, camera);
      }

      /* ── Controls: loaded on their own, so the scene still runs if Tweakpane can't load ── */
      // (the toggle stays hidden unless the panel is built)
      import('tweakpane').then(({ Pane }) => buildPanel(Pane, applyParams))
        .catch((err) => console.warn('[HAMOREBI] Controls unavailable.', err));
    }

    /* ── Tweakpane: style presets, then every value (UI → params → applyParams → uniforms) ── */
    function buildPanel(Pane, applyParams) {
      const tp   = document.getElementById('tp');
      const pane = new Pane({ title: 'Hamorebi', container: tp });

      // A style sets the colours; everything stays adjustable afterwards
      const styleOptions = Object.fromEntries(Object.keys(STYLES).map((k) => [k, k]));
      pane.addBinding(params, 'style', { label: 'Stile', options: styleOptions }).on('change', ({ value }) => {
        Object.assign(params, STYLES[value]);
        pane.refresh();                                  // the colour pickers show the new values
        applyParams();
      });

      const colours = pane.addFolder({ title: 'Colori' });
      colours.addBinding(params, 'base',      { label: 'Fondo',          view: 'color' });
      colours.addBinding(params, 'shade',     { label: 'Ombra',          view: 'color' });
      colours.addBinding(params, 'light',     { label: 'Luce',           view: 'color' });
      colours.addBinding(params, 'washLight', { label: 'Velatura chiara', view: 'color' });
      colours.addBinding(params, 'washShade', { label: 'Velatura scura',  view: 'color' });

      // Step 0.001 where a default has three decimals, so dragging can land on it again
      const gazeF = pane.addFolder({ title: 'Sguardo', expanded: false });
      gazeF.addBinding(params, 'gazeRadius',   { label: 'Raggio',    min: 0.01, max: 1.5, step: 0.001 });
      gazeF.addBinding(params, 'gazeSoftness', { label: 'Sfumatura', min: 0.01, max: 3,   step: 0.01 }); // 0 would break smoothstep
      gazeF.addBinding(params, 'gazeSquash',   { label: 'Ellisse',   min: 0,    max: 1,   step: 0.01 });
      gazeF.addBinding(params, 'gazeTurn',     { label: 'Rotazione', min: 0,    max: 1,   step: 0.001 });

      const shimmerF = pane.addFolder({ title: 'Tremolio', expanded: false });
      shimmerF.addBinding(params, 'shimmerFreq', { label: 'Frequenza', min: 0, max: 2, step: 0.01 });
      shimmerF.addBinding(params, 'shimmerAmp',  { label: 'Ampiezza',  min: 0, max: 3, step: 0.01 });
      shimmerF.addBinding(params, 'shimmerTurn', { label: 'Direzione', min: 0, max: 1, step: 0.01 });

      const leavesF = pane.addFolder({ title: 'Foglie', expanded: false });
      leavesF.addBinding(params, 'leafScale',   { label: 'Scala',       min: 0.05, max: 2,   step: 0.001 });
      leavesF.addBinding(params, 'leafSpread',  { label: 'Spostamento', min: 0,    max: 3,   step: 0.01 });
      leavesF.addBinding(params, 'leafAngle',   { label: 'Angolo (°)',  min: 0,    max: 360, step: 1 });
      leavesF.addBinding(params, 'leafStretch', { label: 'Allungamento', min: 0,   max: 1,   step: 0.01 });

      const blurF = pane.addFolder({ title: 'Sfocatura' });
      blurF.addBinding(params, 'blurRadius', { label: 'Raggio',       min: 0, max: 2, step: 0.001 });
      blurF.addBinding(params, 'blurTilt',   { label: 'Fuoco (tilt)', min: 0, max: 1, step: 0.01 });

      pane.addBlade({ view: 'separator' });
      pane.addButton({ title: 'Reset' }).on('click', () => {       // back to the current style's values
        Object.assign(params, SHAPE, STYLES[params.style]);
        pane.refresh();
        applyParams();
      });
      pane.on('change', applyParams);

      // Panel closed by default on narrow screens, so it doesn't cover the light
      const toggle   = document.getElementById('tp-toggle');
      const setPanel = (open) => { tp.hidden = !open; toggle.setAttribute('aria-expanded', String(open)); };
      setPanel(!matchMedia('(max-width: 640px)').matches);
      toggle.addEventListener('click', () => setPanel(tp.hidden));
      toggle.hidden = false;
    }
